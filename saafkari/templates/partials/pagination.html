{% if page_obj.paginator.num_pages > 1 %}
  <nav class="mt-10 flex items-center justify-center gap-2">
    {% if page_obj.has_previous %}
      <a href="{{ request|querystring_without:'page' }}page={{ page_obj.previous_page_number }}"
         class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-amber-500">قبلی</a>
    {% endif %}
    <span class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-bold text-white">
      صفحه {{ page_obj.number|fa }} از {{ page_obj.paginator.num_pages|fa }}
    </span>
    {% if page_obj.has_next %}
      <a href="{{ request|querystring_without:'page' }}page={{ page_obj.next_page_number }}"
         class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-amber-500">بعدی</a>
    {% endif %}
  </nav>
{% endif %}
