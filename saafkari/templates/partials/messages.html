{% if messages %}
  <div class="mx-auto mt-4 grid max-w-3xl gap-2 px-4">
    {% for message in messages %}
      <div class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm font-medium
        {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
        {% elif message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800
        {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
        {% else %}border-sky-200 bg-sky-50 text-sky-800{% endif %}">
        <span class="mt-0.5">●</span>
        <p class="flex-1">{{ message }}</p>
      </div>
    {% endfor %}
  </div>
{% endif %}
