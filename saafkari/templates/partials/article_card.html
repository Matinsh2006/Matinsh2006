<article class="group flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
  <a href="{{ article.get_absolute_url }}" class="block h-44 overflow-hidden bg-slate-100">
    {% if article.cover %}
      <img src="{{ article.cover.url }}" alt="{{ article.title }}" loading="lazy"
           class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
    {% else %}
      <div class="flex h-full items-center justify-center bg-gradient-to-bl from-amber-500 to-amber-300 text-4xl">📝</div>
    {% endif %}
  </a>
  <div class="flex flex-1 flex-col p-5">
    {% if article.category %}<span class="mb-2 w-fit rounded-lg bg-amber-50 px-2.5 py-1 text-xs font-bold text-amber-700">{{ article.category.name }}</span>{% endif %}
    <h3 class="font-extrabold leading-7 text-slate-900"><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3>
    <p class="mt-2 flex-1 text-sm leading-7 text-slate-600">{{ article.summary|truncatechars:110 }}</p>
    <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-3 text-xs text-slate-500">
      <span>{{ article.published_at|jalali }}</span>
      <span>⏱ {{ article.reading_minutes|fa }} دقیقه مطالعه</span>
    </div>
  </div>
</article>
