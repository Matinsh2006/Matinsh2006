<article class="group flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
  <div class="relative h-44 overflow-hidden bg-slate-100">
    {% if service.image %}
      <img src="{{ service.image.url }}" alt="{{ service.title }}" loading="lazy"
           class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
    {% else %}
      <div class="flex h-full items-center justify-center bg-gradient-to-bl from-slate-800 to-slate-600 text-4xl">🔧</div>
    {% endif %}
    {% if service.category %}
      <span class="absolute right-3 top-3 rounded-lg bg-slate-900/80 px-2.5 py-1 text-xs font-bold text-amber-300">{{ service.category.name }}</span>
    {% endif %}
  </div>
  <div class="flex flex-1 flex-col p-5">
    <h3 class="text-lg font-extrabold text-slate-900">{{ service.title }}</h3>
    <p class="mt-2 flex-1 text-sm leading-7 text-slate-600">{{ service.short_description|default:service.description|truncatechars:90 }}</p>
    <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-4">
      <span class="text-sm font-bold text-amber-600">{{ service.price_label }}</span>
      <span class="text-xs text-slate-500">⏱ {{ service.duration_minutes|fa }} دقیقه</span>
    </div>
    <div class="mt-4 grid grid-cols-2 gap-2">
      <a href="{{ service.get_absolute_url }}" class="rounded-xl border border-slate-300 px-3 py-2 text-center text-sm font-bold text-slate-700 transition hover:border-slate-900">جزئیات</a>
      <a href="{% url 'appointments:booking' %}?service={{ service.slug }}" class="rounded-xl bg-slate-900 px-3 py-2 text-center text-sm font-bold text-white transition hover:bg-slate-800">رزرو</a>
    </div>
  </div>
</article>
