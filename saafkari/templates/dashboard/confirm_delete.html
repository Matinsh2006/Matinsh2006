{% extends "dashboard/base.html" %}
{% block title %}حذف{% endblock %}
{% block page_heading %}تایید حذف{% endblock %}

{% block content %}
<form method="post" class="max-w-lg rounded-2xl border border-rose-200 bg-white p-7">
  {% csrf_token %}
  <p class="text-4xl">⚠️</p>
  <h2 class="mt-4 text-xl font-black text-slate-900">از حذف مطمئن هستید؟</h2>
  <p class="mt-3 leading-7 text-slate-600">«{{ object }}» برای همیشه حذف می‌شود و قابل بازگشت نیست.</p>
  <div class="mt-7 flex gap-3">
    <button type="submit" class="rounded-xl bg-rose-600 px-6 py-3 font-extrabold text-white transition hover:bg-rose-500">بله، حذف کن</button>
    <a href="javascript:history.back()" class="rounded-xl border border-slate-300 px-6 py-3 font-bold text-slate-700 transition hover:border-slate-900">انصراف</a>
  </div>
</form>
{% endblock %}
