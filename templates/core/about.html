{% extends "base.html" %}
{% block title %}درباره {{ site.site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl px-4 py-12">
  <h1 class="text-2xl font-extrabold text-slate-900">درباره {{ site.site_name }}</h1>
  <div class="mt-5 whitespace-pre-line rounded-3xl border border-slate-100 bg-white p-8 text-sm leading-8 text-slate-600">
    {{ site.about|default:"متن معرفی فروشگاه را از پنل مدیریت، بخش تنظیمات سایت وارد کنید." }}
  </div>
</div>
{% endblock %}
